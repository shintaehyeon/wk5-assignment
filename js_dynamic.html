<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DOM 연습 | 작은 도서관</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="wrap">
        <p class="eyebrow">OSS · WEEK 05</p>
        <h1>작은 도서관</h1>
        <nav aria-label="주 메뉴">
          <a href="index.html">홈</a>
          <a href="js_dynamic.html" aria-current="page">DOM 연습</a>
          <a href="crud.html">도서관리</a>
        </nav>
      </div>
    </header>
    <main class="wrap">
      <section class="intro">
        <p class="eyebrow">01 / DOM PRACTICE</p>
        <h2>읽고 싶은 책 목록</h2>
        <p>책 이름을 입력한 후 추가 버튼이나 Enter 키를 눌러 보세요.</p>
      </section>
      <section class="panel">
        <form id="item-form" novalidate>
          <label for="item-input">책 이름</label>
          <div class="inline">
            <input
              id="item-input"
              type="text"
              maxlength="100"
              placeholder="읽고 싶은 책 이름"
              required
            />
            <button type="submit">추가</button>
            <button type="button" id="clear-input" class="secondary">
              입력 초기화
            </button>
          </div>
        </form>
        <p id="message" role="status" aria-live="polite"></p>
      </section>
      <section class="panel">
        <h2>나의 목록 <span id="item-count" class="badge">0</span></h2>
        <p id="empty">아직 추가한 책이 없습니다.</p>
        <ul id="item-list" class="item-list"></ul>
      </section>
    </main>
    <footer class="wrap">HTML · CSS · JavaScript 학습용 도서관리</footer>
    <script>
      const itemForm = document.querySelector("#item-form");
      const itemInput = document.querySelector("#item-input");
      const itemList = document.querySelector("#item-list");
      const message = document.querySelector("#message");

      function updateCount() {
        const count = itemList.children.length;
        document.querySelector("#item-count").textContent = count;
        document.querySelector("#empty").hidden = count > 0;
      }

      itemForm.addEventListener("submit", function (event) {
        event.preventDefault();
        const value = itemInput.value.trim();
        if (value.length === 0 || value.length > 100) {
          message.textContent =
            "책 이름을 공백을 제외하여 1~100자로 입력하세요.";
          itemInput.focus();
          return;
        }
        const li = document.createElement("li");
        const text = document.createElement("span");
        text.textContent = value;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "danger";
        button.textContent = "삭제";
        button.setAttribute("aria-label", value + " 삭제");
        button.addEventListener("click", function () {
          li.remove();
          updateCount();
          message.textContent = "항목을 삭제했습니다.";
        });
        li.append(text, button);
        itemList.append(li);
        itemForm.reset();
        updateCount();
        message.textContent = "목록에 추가했습니다.";
        itemInput.focus();
      });

      document
        .querySelector("#clear-input")
        .addEventListener("click", function () {
          itemForm.reset();
          message.textContent = "입력창을 초기화했습니다. 목록은 유지됩니다.";
          itemInput.focus();
        });
    </script>
  </body>
</html>
